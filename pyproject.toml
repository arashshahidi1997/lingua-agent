[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lingua-agent"
version = "0.1.0"
description = "Agentic AI language-learning platform — any language A → B, local-first, MIT licensed."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arash Shahidi" }]
keywords = ["language-learning", "agent", "llm", "srs", "spaced-repetition", "persian", "farsi", "italian", "russian"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
    "python-frontmatter>=1.1",
    "httpx>=0.27", "uvicorn>=0.52.4,<0.53", "fastapi>=0.141.1,<0.142",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
claude-max = ["claude-agent-sdk>=0.1.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
playground = ["streamlit>=1.30"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "anthropic>=0.40"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
lingua-agent = "lingua_agent.cli:app"

[project.urls]
Homepage = "https://github.com/arash-shahidi/lingua-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/lingua_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
lingua-agent = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
anthropic = { features = ["anthropic"], solve-group = "default" }
api = { features = ["api"], solve-group = "default" }
claude-max = { features = ["claude-max"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
openai = { features = ["openai"], solve-group = "default" }
playground = { features = ["playground"], solve-group = "default" }

[tool.pixi.tasks]
